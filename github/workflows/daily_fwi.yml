name: Update Daily FWI Raster Map

on:
  schedule:
    - cron: '0 0 * * *' # اجرای هر روز ساعت 00:00 UTC
  workflow_dispatch: # امکان اجرای دستی از تب Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests numpy matplotlib scipy

      - name: Run Map Generator Script
        run: python generate_fwi_map.py

      - name: Commit and Push Image
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add fwi_map.png
          git commit -m "Auto-update FWI raster map for tomorrow" || exit 0
          git push
