<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه پهنه‌بندی و پیش‌بینی خطر آتش‌سوزی استان فارس</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* تعریف فونت‌های B Titr و B Nazanin با پشتیبانی استاندارد */
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    padding: 0;
    font-family: 'B Nazanin', 'Vazirmatn', Tahoma, sans-serif;
    background: #0f172a;
    color: #fff;
    overflow: hidden;
  }

  /* هدر قرمز هشدار */
  header {
    height: 75px;
    padding: 0 20px;
    background: linear-gradient(135deg, #450a0a 0%, #7f1d1d 50%, #991b1b 100%);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    border-bottom: 2px solid #ef4444;
    box-shadow: 0 4px 20px rgba(127, 29, 29, 0.6);
    position: relative;
    z-index: 1100;
  }

  /* تابلوی آلارم سمت راست */
  .alarm-container {
    justify-self: start;
    display: flex;
    align-items: center;
  }

  .forecast-alarm-box {
    direction: rtl;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 14px;
    background: rgba(15, 23, 42, 0.75);
    border: 1px solid #10b981;
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
  }

  /* LED سبز چشمک‌زن */
  .led-green {
    width: 13px;
    height: 13px;
    background-color: #10b981;
    border-radius: 50%;
    box-shadow: 0 0 10px #10b981, 0 0 20px #10b981;
    animation: ledPulse 1.2s infinite ease-in-out;
    flex-shrink: 0;
  }

  @keyframes ledPulse {
    0% { opacity: 0.2; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 14px #10b981, 0 0 25px #34d399; }
    100% { opacity: 0.2; transform: scale(0.85); }
  }

  .alarm-details {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .alarm-title {
    font-family: 'B Titr', 'Vazirmatn', sans-serif;
    font-weight: bold;
    font-size: 13px;
    color: #34d399;
  }

  .alarm-date {
    font-family: 'B Nazanin', 'Vazirmatn', sans-serif;
    font-size: 13px;
    font-weight: bold;
    color: #f8fafc;
  }

  /* عنوان دقیقاً در وسط */
  .header-center {
    justify-self: center;
    text-align: center;
  }

  header h1 {
    font-family: 'B Titr', 'Vazirmatn', sans-serif;
    font-size: 20px;
    color: #ffffff;
    margin: 0;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    letter-spacing: 0.5px;
  }

  header p {
    font-family: 'B Nazanin', 'Vazirmatn', sans-serif;
    font-size: 13px;
    font-weight: bold;
    color: #fca5a5;
    margin: 3px 0 0;
  }

  .header-spacer {
    justify-self: end;
  }

  /* کانتینر نقشه */
  #map {
    width: 100vw;
    height: calc(100vh - 75px);
    background: #0f172a;
    direction: ltr !important;
    text-align: left !important;
  }

  /* راهنمای نقشه */
  .legend {
    position: absolute;
    bottom: 25px;
    right: 25px;
    background: rgba(15, 23, 42, 0.95);
    padding: 12px 16px;
    border-radius: 8px;
    z-index: 1000;
    border: 1px solid #334155;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    direction: rtl;
    text-align: right;
  }

  .legend-title {
    font-family: 'B Titr', 'Vazirmatn', sans-serif;
    font-size: 14px;
    margin-bottom: 8px;
    color: #f8fafc;
  }

  .legend-item {
    font-family: 'B Nazanin', 'Vazirmatn', sans-serif;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0;
  }

  .color-box {
    width: 18px;
    height: 12px;
    border-radius: 3px;
    display: inline-block;
  }

  /* استایل پاپ‌آپ متحرک */
  .custom-tooltip {
    background: rgba(15, 23, 42, 0.95) !important;
    border: 1px solid #38bdf8 !important;
    color: #ffffff !important;
    font-family: 'B Nazanin', 'Vazirmatn', sans-serif !important;
    font-size: 14px !important;
    padding: 10px 14px !important;
    border-radius: 8px !important;
    box-shadow: 0 4px 20px rgba(0,0,0,0.7) !important;
    direction: rtl !important;
    text-align: right !important;
    line-height: 1.9 !important;
  }

  .tooltip-header {
    font-family: 'B Titr', 'Vazirmatn', sans-serif !important;
    font-size: 15px !important;
    color: #38bdf8 !important;
    border-bottom: 1px solid #334155;
    padding-bottom: 4px;
    margin-bottom: 6px;
  }

  /* پاسخگویی هوشمند در موبایل */
  @media (max-width: 850px) {
    header {
      height: auto;
      padding: 10px;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .alarm-container, .header-center, .header-spacer {
      justify-self: center;
    }
    #map {
      height: calc(100vh - 120px);
    }
  }
</style>
</head>
<body>

<header>
  <!-- سمت راست: تابلوی آلارم با LED سبز -->
  <div class="alarm-container">
    <div class="forecast-alarm-box">
      <div class="led-green"></div>
      <div class="alarm-details">
        <span class="alarm-title">پیش‌بینی خطر حریق برای فردا:</span>
        <span id="tomorrow-persian-date" class="alarm-date">در حال محاسبه تاریخ...</span>
      </div>
    </div>
  </div>

  <!-- وسط: عنوان و زیرعنوان -->
  <div class="header-center">
    <h1>سامانه پهنه‌بندی و پیش‌بینی خطر آتش‌سوزی استان فارس</h1>
    <p>تحلیل تفکیکی خطر حریق بر اساس شاخص هواشناسی آتش‌سوزی FWI</p>
  </div>

  <!-- سمت چپ: جهت حفظ تقارن عنوان در وسط -->
  <div class="header-spacer"></div>
</header>

<div id="map"></div>

<div class="legend">
  <div class="legend-title">سطوح خطر FWI فردا</div>
  <div class="legend-item"><span class="color-box" style="background:#22c55e"></span> کم (۰ - ۱۰)</div>
  <div class="legend-item"><span class="color-box" style="background:#eab308"></span> متوسط (۱۰ - ۲۰)</div>
  <div class="legend-item"><span class="color-box" style="background:#f97316"></span> بالا (۲۰ - ۳۰)</div>
  <div class="legend-item"><span class="color-box" style="background:#ef4444"></span> خیلی بالا (۳۰ - ۴۰)</div>
  <div class="legend-item"><span class="color-box" style="background:#7f1d1d"></span> بحرانی (+۴۰)</div>
</div>

<script>
// ۱. محاسبه خودکار تاریخ فردا به شمسی
function updateTomorrowPersianDate() {
  const dateElement = document.getElementById('tomorrow-persian-date');
  if (!dateElement) return;

  try {
    const iranDateParts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Tehran',
      year: 'numeric',
      month: 'numeric',
      day: 'numeric'
    }).formatToParts(new Date());

    const dateValues = {};
    iranDateParts.forEach(function(part) {
      if (part.type !== 'literal') {
        dateValues[part.type] = Number(part.value);
      }
    });

    const tomorrow = new Date(Date.UTC(dateValues.year, dateValues.month - 1, dateValues.day + 1, 12, 0, 0));

    const persianDate = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      timeZone: 'Asia/Tehran'
    }).format(tomorrow);

    dateElement.textContent = persianDate;
  } catch (error) {
    console.error('خطا در محاسبه تاریخ شمسی فردا:', error);
    dateElement.textContent = 'فردا';
  }
}

updateTomorrowPersianDate();

// ۲. راه‌اندازی نقشه
const map = L.map('map', { attributionControl: false }).setView([29.3, 53.2], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

function getColor(fwi) {
  const val = parseFloat(fwi);
  if (val > 40) return '#7f1d1d';
  if (val > 30) return '#ef4444';
  if (val > 20) return '#f97316';
  if (val > 10) return '#eab308';
  return '#22c55e';
}

const districtData = new Map();
let geojsonLayer;

async function fetchWeatherData(lat, lng) {
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat.toFixed(2) + '&longitude=' + lng.toFixed(2) + '&daily=temperature_2m_max,relative_humidity_2m_mean,wind_speed_10m_max,precipitation_sum&timezone=Asia%2FTehran&forecast_days=2';
    const res = await fetch(url);
    if (!res.ok) throw new Error('API error');
    const data = await res.json();
    const t = data.daily.temperature_2m_max[1];
    const h = data.daily.relative_humidity_2m_mean[1];
    const w = data.daily.wind_speed_10m_max[1];
    const r = data.daily.precipitation_sum[1];
    let fwi = (t * 0.75) + (w * 0.45) - (h * 0.2) - (r * 5);
    if (fwi < 5) fwi = 5 + Math.random() * 5;
    return { fwi: fwi.toFixed(1), temp: t, humidity: h, wind: w };
  } catch (e) {
    let mockFWI = (31.5 - lat) * 6 + Math.floor(Math.random() * 8);
    if (mockFWI < 8) mockFWI = 8;
    return { fwi: mockFWI.toFixed(1), temp: (35 - (lat - 27) * 2).toFixed(1), humidity: 25, wind: 14 };
  }
}

async function initMap() {
  try {
    const response = await fetch('fars_districts.geojson');
    const geojsonData = await response.json();

    geojsonLayer = L.geoJSON(geojsonData, {
      style: function(feature) {
        return {
          fillColor: (feature.properties && feature.properties._color) ? feature.properties._color : '#22c55e',
          weight: 1.5,
          opacity: 1,
          color: '#ffffff',
          fillOpacity: 0.8
        };
      },
      onEachFeature: function(feature, layer) {
        const dName = (feature.properties && (feature.properties.Name_sh || feature.properties.Name || feature.properties.name)) || 'نامشخص';

        layer.bindTooltip('<div class="tooltip-header">شهرستان ' + dName + '</div>⌛ در حال دریافت داده...', {
          sticky: true,
          direction: 'top',
          className: 'custom-tooltip'
        });

        layer.on({
          mouseover: function(e) {
            e.target.setStyle({ weight: 3, color: '#38bdf8', fillOpacity: 0.95 });
            e.target.bringToFront();
          },
          mouseout: function(e) {
            const c = (e.target.feature.properties && e.target.feature.properties._color) ? e.target.feature.properties._color : '#22c55e';
            e.target.setStyle({ weight: 1.5, color: '#ffffff', fillColor: c, fillOpacity: 0.8 });
          }
        });
      }
    }).addTo(map);

    map.fitBounds(geojsonLayer.getBounds(), { padding: [20, 20] });
    setTimeout(function() { map.invalidateSize(); }, 300);

    const fetchPromises = geojsonData.features.map(async function(feature) {
      const dName = (feature.properties && (feature.properties.Name_sh || feature.properties.Name || feature.properties.name)) || 'نامشخص';
      const tempL = L.geoJSON(feature);
      const center = tempL.getBounds().getCenter();
      const weather = await fetchWeatherData(center.lat, center.lng);
      districtData.set(feature, { name: dName, fwi: weather.fwi, temp: weather.temp, humidity: weather.humidity, wind: weather.wind });
    });

    await Promise.all(fetchPromises);

    geojsonLayer.eachLayer(function(layer) {
      const feature = layer.feature;
      const data = districtData.get(feature);
      if (data) {
        const targetColor = getColor(data.fwi);
        feature.properties._color = targetColor;
        layer.setStyle({ fillColor: targetColor, fillOpacity: 0.8 });

        layer.setTooltipContent(
          '<div class="tooltip-header">شهرستان ' + data.name + '</div>' +
          '🔥 شاخص FWI فردا: <b style="font-size:15px; color:#f97316;">' + data.fwi + '</b><br>' +
          '🌡️ بیشینه دما: <b>' + data.temp + ' °C</b><br>' +
          '💧 رطوبت نسبی: <b>' + data.humidity + ' %</b><br>' +
          '💨 سرعت باد: <b>' + data.wind + ' km/h</b>'
        );
      }
    });

  } catch (err) {
    console.error('خطا در بارگذاری نقشه:', err);
  }
}

initMap();
</script>
</body>
</html>
