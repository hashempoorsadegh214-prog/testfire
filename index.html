<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>سامانه پهنه‌بندی تفکیکی FWI شهرستان‌های استان فارس</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { margin: 0; font-family: Tahoma, sans-serif; background: #0f172a; color: #fff; }
  header { padding: 10px 20px; background: #1e293b; display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; color: #f97316; margin: 0; }
  header p { font-size: 12px; color: #94a3b8; margin: 4px 0 0; }
  #map { width: 100%; height: calc(100vh - 65px); background: #0f172a; }
  
  .info-box { position: absolute; top: 80px; left: 20px; background: rgba(15,23,42,0.9);
              padding: 12px 16px; border: 1px solid #334155; border-radius: 8px; z-index: 1000; font-size: 13px; line-height: 1.6; }
  
  .legend { position: absolute; bottom: 25px; right: 25px; background: rgba(15,23,42,0.9);
            padding: 12px; border-radius: 10px; font-size: 12px; z-index: 1000; border: 1px solid #334155; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .color-box { width: 18px; height: 12px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>

<header>
  <div>
    <h1>سامانه پهنه‌بندی تفکیکی FWI (Choropleth) استان فارس</h1>
    <p>تحلیل تفکیکی خطر آتش‌سوزی به تفکیک مرز شهرستان‌ها | پیش‌بینی فردا</p>
  </div>
</header>

<div id="map"></div>
<div id="info" class="info-box">برای مشاهده اطلاعات، نشانگر را روی شهرستان ببرید</div>

<div class="legend">
  <b>سطوح خطر FWI فردا</b>
  <div class="legend-item"><span class="color-box" style="background:#22c55e"></span> کم (۰ - ۱۰)</div>
  <div class="legend-item"><span class="color-box" style="background:#eab308"></span> متوسط (۱۰ - ۲۰)</div>
  <div class="legend-item"><span class="color-box" style="background:#f97316"></span> بالا (۲۰ - ۳۰)</div>
  <div class="legend-item"><span class="color-box" style="background:#ef4444"></span> خیلی بالا (۳۰ - ۴۰)</div>
  <div class="legend-item"><span class="color-box" style="background:#7f1d1d"></span> بحرانی (+۴۰)</div>
</div>

<script>
const map = L.map('map').setView([29.3, 53.2], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// تابع تعیین رنگ بر اساس میزان FWI
function getColor(fwi) {
  return fwi > 40 ? '#7f1d1d' :
         fwi > 30 ? '#ef4444' :
         fwi > 20 ? '#f97316' :
         fwi > 10 ? '#eab308' :
                    '#22c55e';
}

// لیست مختصات مرکز شهرستان‌ها برای استعلام Open-Meteo
const districtData = {
  "شیراز": { lat: 29.62, lon: 52.54 },
  "مرودشت": { lat: 29.87, lon: 52.81 },
  "کازرون": { lat: 29.62, lon: 51.65 },
  "سپیدان": { lat: 30.26, lon: 51.98 },
  "لارستان": { lat: 27.68, lon: 54.34 },
  "اقلید": { lat: 30.89, lon: 52.68 },
  "جهرم": { lat: 28.50, lon: 53.56 },
  "فیروزآباد": { lat: 28.84, lon: 52.57 },
  "فسا": { lat: 28.94, lon: 53.65 },
  "آباده": { lat: 31.16, lon: 52.65 },
  "لامرد": { lat: 27.33, lon: 53.18 },
  "داراب": { lat: 28.75, lon: 54.54 },
  "نی‌ریز": { lat: 29.20, lon: 54.33 },
  "ممسنی": { lat: 30.12, lon: 51.52 },
  "خرم‌بید": { lat: 30.58, lon: 53.15 }
};

const fwiResults = {};

async function fetchAllFWI() {
  for (const [name, coords] of Object.entries(districtData)) {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&daily=temperature_2m_max,relative_humidity_2m_mean,wind_speed_10m_max,precipitation_sum&timezone=Asia%2FTehran&forecast_days=2`;
      const res = await fetch(url);
      const data = await res.json();
      const t = data.daily.temperature_2m_max[1];
      const h = data.daily.relative_humidity_2m_mean[1];
      const w = data.daily.wind_speed_10m_max[1];
      const r = data.daily.precipitation_sum[1];
      
      let fwi = (t * 0.4) + (w * 0.3) - (h * 0.15) - (r * 2);
      if (fwi < 0) fwi = 0;
      
      fwiResults[name] = { fwi: fwi.toFixed(1), temp: t, wind: w, humidity: h };
    } catch (e) {
      fwiResults[name] = { fwi: 15, temp: "-", wind: "-", humidity: "-" };
    }
  }
  loadGeoJSON();
}

function loadGeoJSON() {
  // بارگذاری مرزها
  fetch('fars_districts.geojson')
    .then(res => res.json())
    .then(data => {
      L.geoJSON(data, {
        style: function(feature) {
          const name = feature.properties.name || feature.properties.NAME_2;
          const info = fwiResults[name] || { fwi: 10 };
          return {
            fillColor: getColor(parseFloat(info.fwi)),
            weight: 1.5,
            opacity: 1,
            color: '#ffffff',
            fillOpacity: 0.65
          };
        },
        onEachFeature: function(feature, layer) {
          const name = feature.properties.name || feature.properties.NAME_2;
          
          layer.on({
            mouseover: function(e) {
              const l = e.target;
              l.setStyle({ weight: 3, color: '#f8fafc', fillOpacity: 0.85 });
              const info = fwiResults[name] || { fwi: "نامشخص", temp: "-", wind: "-" };
              document.getElementById('info').innerHTML = `
                <b style="font-size:15px;color:#38bdf8;">شهرستان ${name}</b><br>
                🔥 شاخص FWI فردا: <b>${info.fwi}</b><br>
                🌡️ حداکثر دما: ${info.temp} °C<br>
                💨 سرعت باد: ${info.wind} km/h
              `;
            },
            mouseout: function(e) {
              const l = e.target;
              l.setStyle({ weight: 1.5, color: '#ffffff', fillOpacity: 0.65 });
              document.getElementById('info').innerHTML = 'برای مشاهده اطلاعات، نشانگر را روی شهرستان ببرید';
            }
          });
        }
      }).addTo(map);
    });
}

fetchAllFWI();
</script>
</body>
</html>
