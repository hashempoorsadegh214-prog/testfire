<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقشه پهنه‌بندی رستری FWI استان فارس</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />

    <style>
        * { box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { 
            background: #1e293b; 
            padding: 12px 20px; 
            border-bottom: 1px solid #334155; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 1000; 
        }
        .header-title h1 { font-size: 1.1rem; color: #f97316; }
        .header-title p { font-size: 0.75rem; color: #94a3b8; }
        
        .badge { 
            background: #ef4444; 
            color: white; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 0.85rem;
        }

        #map { flex: 1; height: 100%; background: #0f172a; }

        .legend { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            background: rgba(15,23,42,0.95); 
            padding: 12px; 
            border-radius: 8px; 
            z-index: 999; 
            font-size: 0.8rem; 
            border: 1px solid #334155; 
            color: #fff;
        }
        .gradient-bar {
            height: 12px;
            width: 100%;
            background: linear-gradient(to left, #7f1d1d, #ef4444, #f97316, #eab308, #22c55e);
            border-radius: 4px;
            margin: 6px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>سامانه پهنه‌بندی رستری شاخص FWI استان فارس</h1>
            <p>درونیابی فضایی پیوسته (Spatial Interpolation) | به‌روزرسانی خودکار روزانه</p>
        </div>
        <div class="badge">
            📅 پیش‌بینی FWI فردا
        </div>
    </header>

    <div style="position: relative; flex: 1;">
        <div id="map"></div>
        <div class="legend">
            <b>راهنمای شدت خطر FWI</b>
            <div class="gradient-bar"></div>
            <div style="display: flex; justify-content: space-between; font-size: 0.7rem;">
                <span>کم (۰)</span>
                <span>متوسط (۱۵)</span>
                <span>بحرانی (+۳۵)</span>
            </div>
        </div>
    </div>

    <script>
        // ۱. راه‌اندازی نقشه
        const map = L.map('map').setView([29.3, 53.2], 7);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // ۲. انداختن تصویر رستری (fwi_map.png) روی مختصات دقیق استان فارس
        const imageBounds = [
            [27.0, 50.4], // جنوب غربی [Lat, Lon]
            [31.6, 55.6]  // شمال شرقی [Lat, Lon]
        ];

        // لود تصویر با کش‌شکن جهت نمایش آخرین نسخه روزانه
        const imageUrl = 'fwi_map.png?v=' + new Date().getTime();

        L.imageOverlay(imageUrl, imageBounds, {
            opacity: 0.75,
            interactive: true
        }).addTo(map);
    </script>
</body>
</html>
